spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/res_exam_bank?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Singapore}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  port: ${SERVER_PORT:8080}

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET:dGhpc0lzQVN0YXJ0ZXJKd3RTZWNyZXRLZXlGb3JEZXZlbG9wbWVudE9ubHkhMTIzNDU2Nzg5MA==}
      expiration: 86400000
